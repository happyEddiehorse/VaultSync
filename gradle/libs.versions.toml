# 依赖版本目录 —— 项目内所有版本号的唯一来源。
# 改动前先看 memory/DECISIONS.md（D-003 JGit 锁定 5.13.x；D-011 工具链）与 memory/LESSONS.md。

[versions]
agp = "8.13.2"
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
# 以下 AndroidX 版本是 compileSdk 36 + AGP 8.13 能用的最后一批（aar-metadata 实测，见 LESSONS L-013）：
# Compose 1.12.x / lifecycle 2.11 / navigation 2.10 / core 1.19 都要求 compileSdk 37 + AGP 9.1
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.9.6"
# core 1.19.0 要求 compileSdk 37 + AGP 9.1；1.18.0 要求 compileSdk 36 + AGP 8.9.1（aar-metadata 实测）
coreKtx = "1.18.0"
# JGit：禁止升级到 6.x/7.x（Android 10 不可用，见 LESSONS L-001）
jgit = "5.13.5.202508271544-r"
jsch = "2.28.7"
bouncycastle = "1.86"
slf4j = "1.7.36"
junit = "5.14.4"
junitPlatform = "1.14.4"
# 仅测试：JGit 自带的 SSH 测试服务器（MINA sshd 2.7.0 随之引入）与它解析 ed25519 公钥需要的 eddsa 库
eddsa = "0.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
jgit-ssh-jsch = { group = "org.eclipse.jgit", name = "org.eclipse.jgit.ssh.jsch", version.ref = "jgit" }
jsch = { group = "com.github.mwiede", name = "jsch", version.ref = "jsch" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk15to18", version.ref = "bouncycastle" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
slf4j-android = { group = "org.slf4j", name = "slf4j-android", version.ref = "slf4j" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
jgit-junit-ssh = { group = "org.eclipse.jgit", name = "org.eclipse.jgit.junit.ssh", version.ref = "jgit" }
eddsa = { group = "net.i2p.crypto", name = "eddsa", version.ref = "eddsa" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
